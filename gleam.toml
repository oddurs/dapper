name = "dapper"
version = "0.1.0"
description = "Grammar-of-graphics charting for Gleam. Type-checked encodings, SVG output, Erlang and JavaScript targets."
licences = ["Apache-2.0"]
repository = { type = "github", user = "oddurs", repo = "dapper" }

gleam = ">= 1.17.0"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
qcheck = ">= 1.0.4 and < 2.0.0"
birdie = ">= 2.0.2 and < 3.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
