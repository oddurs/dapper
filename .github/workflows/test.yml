name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [erlang, javascript]
    name: test (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.17.0"
          rebar3-version: "3"
      - uses: actions/setup-node@v4
        if: matrix.target == 'javascript'
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gleam
          key: ${{ runner.os }}-gleam-${{ hashFiles('manifest.toml') }}
          restore-keys: ${{ runner.os }}-gleam-
      - run: gleam deps download
      - run: gleam test --target ${{ matrix.target }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.17.0"
          rebar3-version: "3"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gleam
          key: ${{ runner.os }}-gleam-${{ hashFiles('manifest.toml') }}
          restore-keys: ${{ runner.os }}-gleam-
      - run: gleam deps download
      - run: gleam format --check src test
      - run: ./scripts/check-banned.sh
